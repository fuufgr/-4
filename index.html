<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>უნარების სია
        <script src="https://cdn.tailwindcss.com"></script>
    </title>
</head>

<body class="bg-white-950 text-pink min-h-screen flex items-center justify-center p-5">

    <main class="w-full max-w-lg bg-white-900 rounded-2xl p-7 shadow-2xl border border-pink-800">

        <h1 class="text-3xl font-bold text-center mb-2">
        </h1>

        <p class="text-white-400 text-center mb-7">
        </p>

        <div class="flex gap-2 mb-3">
            <input id="skill-input" type="text" placeholder="JavaScript"
                class="flex-1 min-w-0 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-sky-500">
            <button id="add-btn" class="bg-sky-600 hover:bg-sky-500 px-5 rounded-xl font-semibold">
            </button>
        </div>
        <p id="error-message" class="hidden text-rose-400 text-sm mb-4">
        </p>

        <div class="flex justify-between items-center mb-4">
            <p id="status-message" class="text-sm text-slate-400 font-medium">
            </p>

            <span class="bg-slate-800 px-3 py-1 rounded-lg">
                <span id="counter">0</span>
            </span>
        </div>

        <ul id="skills-list" class="space-y-2 mb-6"></ul>

        <button id="clear-btn"
            class="w-full border border-rose-500/40 text-rose-400 hover:bg-rose-500/10 py-3 rounded-xl">
        </button>

    </main>

    <script src="script.js"></script>
</body>

</html>

</html>
